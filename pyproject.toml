[project]
name = "luxprovide-benchmarks"
version = "0.1.0"
description = "LuxProvide algorithm-circuit and volumetric benchmarks, reported through the eq1val framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eq1val",
    "pytest>=8.0",
    "matplotlib>=3.8",
    "qiskit>=2.4.2",
    "mqt-bench>=2.2.3",
]

[tool.uv.sources]
eq1val = { git = "ssh://git@github.com/equal1/equal1-device-validation.git", rev = "db660ef92fdff9d8b9c45edf1ae55c0decfcea8a" }

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "opt_in: only runs when its file is named on the command line (or -m opt_in)",
] 
